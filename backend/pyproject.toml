[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dspy[optuna]>=3.2.1,<3.3",
    "fastapi[standard]>=0.138.2",
    "httpx>=0.28.1",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "mcp[cli]>=1.28.1",
    "openai>=1.0.0",
    "pandas>=3.0.3",
    "playwright>=1.61.0",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.14.2",
    "pyshp>=3.1.4",
    "python-dotenv>=1.2.2",
    "shapely>=2.1.2",
    "tzdata>=2025.3",
]

[tool.uv]
# litellm 1.9x는 네이티브 Rust 라이브러리(litellm-rust) 빌드가 필요해 Windows에서
# prebuilt 휠 없이 설치가 실패한다. dspy는 litellm>=1.64.0만 요구하므로, Rust가
# 필요 없는(순수 파이썬) 1.80 미만으로 고정한다.
override-dependencies = ["litellm<1.80"]
